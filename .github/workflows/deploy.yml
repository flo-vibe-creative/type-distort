# main에 올릴 때마다 정적 빌드를 만들어 GitHub Pages에 배포한다.
name: 배포

on:
  push:
    branches: [main]
  # 코드 변경 없이 다시 배포하고 싶을 때 손으로 돌릴 수 있게 열어둔다
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치지 않도록 한 번에 하나만 돌린다
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: 테스트
        run: npm test

      - name: 정적 빌드
        run: npm run build
        env:
          # Pages는 flo-vibe-creative.github.io/type-distort 아래에서 서비스된다
          NEXT_PUBLIC_BASE_PATH: /type-distort

      # Jekyll이 _next 폴더를 건너뛰지 않도록 표시를 남긴다
      - name: Jekyll 처리 끄기
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
